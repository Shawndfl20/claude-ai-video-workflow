<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>零手續費的機票錢（Shorts）</title>
<link rel="stylesheet" href="../../kit/styles/handdrawn/shell.css">
<style>
  #frame { --grain: 0; --vignette: rgba(0, 0, 0, .45); }
  .ar { position: absolute; font-family: "NotoSC", sans-serif; font-weight: 900; white-space: nowrap; line-height: 1.1; color: #fff; }
  .c { transform: translateX(-50%); }
  .neon { -webkit-text-stroke: 6px #1a0f3a; paint-order: stroke fill; text-shadow: 0 0 18px rgba(255, 80, 200, .8), 0 8px 0 #1a0f3a; }
  .box { position: absolute; border-radius: 22px; border: 6px solid #fff; background: #170e3c; box-sizing: border-box; }
  .pill { position: absolute; padding: 10px 28px; border-radius: 40px; font-family: "NotoSC", sans-serif; font-weight: 900; font-size: 48px; color: #140c34; white-space: nowrap; }
  .dmg { position: absolute; font-family: "NotoSC", sans-serif; font-weight: 900; font-size: 72px; color: #ff4d6d; white-space: nowrap; -webkit-text-stroke: 7px #1a0f3a; paint-order: stroke fill; }
</style>
</head>
<body>
<script src="../../kit/core/anim.js"></script>
<script src="../../kit/core/timeline.js"></script>
<script src="../../kit/core/captions.js"></script>
<script src="../../kit/core/page.js"></script>
<script src="../../kit/styles/handdrawn/shell.js"></script>
<script src="../../kit/styles/handdrawn/art.js"></script>
<script src="../../kit/styles/handdrawn/motion.js"></script>
<script src="../../kit/styles/handdrawn/arcade.js"></script>
<script>
/* Shorts for the arcade long video: P2 (自己飛) pays no trading fee but buys a plane ticket (the wire fee);
   the same ticket is 10% of 1萬 and 1% of 10萬 on one HP bar. Key art stays above y 1230 (captions below). */
const { NAVY, PINK, CYAN, P1: P1C, P2: P2C, GOLD, RED, GREEN } = ARC;
buildShell({ bg: "linear-gradient(180deg, #0d0826 0%, #2b1460 55%, #4a1a6b 100%)", glyphs: "TC" });
defineScenes();
const LAYER = makeSceneLayers(), S = LAYER;
const chunks = makeChunks({ maxChars: 14, plain: true, hardBreaks: true });

const CC = (s) => s.replace(/[^A-Za-z0-9㐀-鿿]/g, "").length;
const W = (i, word, lag = .15) => {
  const t = TL.lines[i].t, k = t.indexOf(word);
  if (k < 0) throw new Error(`line ${i} has no "${word}"`);
  return at(i, Math.min(D(i) - .05, D(i) * CC(t.slice(0, k)) / CC(t) + lag));
};
const F = (i, f) => at(i, D(i) * f);
const LS = (s, n = 0) => lineOf(s, n);
const SFX = [];
const cue = (t, kind, gain = 1) => { SFX.push([+t.toFixed(3), kind, gain]); return t; };
window.SFX = SFX;

/* ---------- backdrop: sun on the horizon, moving grid below it ---------- */
const backdrop = el("div", "abs", SHELL.frame);
SHELL.frame.insertBefore(backdrop, Object.values(LAYER)[0]);
Object.assign(backdrop.style, { left: 0, top: 0, width: "1080px", height: "1920px" });
const sun = put(backdrop, 560, 280, `<defs><linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe14f"/><stop offset="1" stop-color="#ff3fa4"/></linearGradient></defs>
  <path d="M0 280 A280 280 0 0 1 560 280 Z" fill="url(#sun)"/>${[0, 1, 2, 3, 4].map((k) => `<rect x="0" y="${160 + k * 26}" width="560" height="${4 + k * 2}" fill="#2b1460"/>`).join("")}`, 260, 760);
const grid = put(backdrop, 1080, 880, "", 0, 1040);
const gridSvg = grid.querySelector("svg");
gridSvg.insertAdjacentHTML("afterbegin", `<rect width="1080" height="880" fill="#1b0b3d"/>` + [...Array(15)].map((_, k) => `<line x1="${540 + (k - 7) * 40}" y1="0" x2="${540 + (k - 7) * 260}" y2="880" stroke="${PINK}" stroke-width="3" opacity=".5"/>`).join(""));
const gridLines = [...Array(10)].map(() => { const l = document.createElementNS("http://www.w3.org/2000/svg", "line"); l.setAttribute("stroke", PINK); l.setAttribute("stroke-width", "3"); l.setAttribute("opacity", ".5"); gridSvg.appendChild(l); return l; });

/* ---------- helpers ---------- */
const T = (parent, text, size, x, y, { color = "#fff", cls = "ar neon c" } = {}) => { const d = el("div", cls, parent, text); d.style.fontSize = size + "px"; d.style.color = color; return place(d, x, y); };
const Box = (parent, x, y, w, h, color = "#fff") => { const d = el("div", "box", parent); Object.assign(d.style, { left: x + "px", top: y + "px", width: w + "px", height: h + "px", borderColor: color }); return d; };
const Pill = (parent, text, x, y, bg) => { const d = el("div", "pill", parent, text); d.style.background = bg; return place(d, x, y); };
const Layer = (parent) => { const d = el("div", "abs", parent); Object.assign(d.style, { left: 0, top: 0, width: "1080px", height: "1920px" }); return d; };
const P1 = (parent, x, y, s = 260) => put(parent, 200, 200, p1Art(), x, y, { size: [s, s], origin: "50% 100%" });
const P2 = (parent, x, y, s = 260) => put(parent, 200, 200, p2Art(), x, y, { size: [s, s], origin: "50% 100%" });
/** Pop in at a0 (overshoot), fade out at a1; keeps a centring translate when `c`. */
function popE(e, t, a0, a1 = 1e9, { c = true, s = 1, x = 0, y = 0 } = {}) {
  const p = t < a0 ? 0 : popS(t, a0), o = popA(t, a0, a1, .2);
  e.style.opacity = o;
  e.style.transform = `${c ? "translateX(-50%) " : ""}translate(${x}px, ${y}px) scale(${p * s})`;
  return o;
}
/** NEW WORD! card: term and its plain meaning. */
const word = (parent, w, def) => { const b = Box(parent, 90, 930, 900, 200, GOLD); T(b, "NEW WORD!", 40, 40, 12, { color: GOLD, cls: "ar" }); T(b, w, 64, 40, 70, { cls: "ar" }); const d = T(b, def, 48, 850, 86, { cls: "ar", color: "#cfd8ff" }); d.style.transform = "translateX(-100%)"; return b; };
const B = {};

/* ---------- hook: $0, then a plane ticket takes a coin ---------- */
const h = [LS("hook"), LS("hook", 1)];
const hP2 = P2(S.hook, 410, 520);
const hSign = Box(S.hook, 290, 170, 500, 300, CYAN); T(hSign, "手續費", 64, 244, 20); T(hSign, "$0", 120, 244, 130, { color: CYAN });
const hTicket = put(S.hook, 300, 130, ticketArt(), 0, 0, { size: [360, 156] });
const hCoin = put(S.hook, 90, 90, coinIco(90), 495, 600);
const hDmg = T(S.hook, "−$", 90, 900, 500, { cls: "dmg c" });
Object.assign(B, { zero: cue(W(h[0], "零手續費", 0), "cash"), tk: cue(W(h[1], "機票", -.35), "whoosh") });
B.hit = cue(B.tk + .55, "wrong");
function rHook(t) {
  popE(hP2, t, .05, 1e9, { c: false, y: bob(t, 1, 6, 4) + settle(t - B.hit, 10, 5, 4) });
  popE(hSign, t, .05, 1e9, { c: false, s: 1 + .08 * (1 - eo(prog(t, B.zero, .5))) * (t > B.zero) });
  const k = eio(prog(t, B.tk, .55));
  place(hTicket, lerp(1100, 640, k), lerp(380, 600, k));
  hTicket.style.opacity = +(t >= B.tk);
  hTicket.style.transform = `rotate(${lerp(-25, -8, k) + settle(t - B.hit, 8, 4, 3)}deg)`;
  const f = prog(t, B.hit, .7);
  hCoin.style.opacity = t < B.hit ? 0 : 1 - prog(t, B.hit + .5, .3);
  hCoin.style.transform = `translate(${f * 260}px, ${-260 * f + 300 * f * f}px)`;
  popE(hDmg, t, B.hit + .05, 1e9, { y: -30 * eo(prog(t, B.hit, .5)) });
}

/* ---------- routes: two players, then each one in turn ---------- */
const r = [LS("routes"), LS("routes", 1), LS("routes", 2)];
const rP1 = P1(S.routes, 110, 470), rP2 = P2(S.routes, 710, 470);
const rN1 = T(S.routes, "找代購", 64, 240, 760, { color: P1C }), rN2 = T(S.routes, "自己飛", 64, 840, 760, { color: P2C });
const rVs = T(S.routes, "VS", 170, 540, 500, { color: GOLD });
const rW1 = word(S.routes, "複委託", "台灣券商幫你買"), rW2 = word(S.routes, "海外券商", "自己開戶下單");
const rPlane = put(S.routes, 200, 120, planeArt(), 0, 0, { size: [240, 144] });
Object.assign(B, { two: cue(W(r[0], "兩條路", 0), "boom", .8), p1: cue(W(r[1], "台灣券商", 0), "pop"), w1: cue(W(r[1], "複委託", 0), "magic", .6),
  p2: cue(W(r[2], "海外券商", 0), "pop"), fly: cue(W(r[2], "飛", 0), "whoosh") });
B.w2 = cue(B.p2 + .4, "magic", .6);
function rRoutes(t) {
  const m1 = eio(prog(t, B.p1, .5)), m2 = eio(prog(t, B.p2, .5));
  // P1: from the left half to the centre, out when P2 takes over
  popE(rP1, t, L(r[0]) - .2, B.p2 - .1, { c: false, x: m1 * 300, y: bob(t, 0, 6, 4), s: 1 + .25 * m1 });
  popE(rP2, t, L(r[0]) - .1, B.p1, { c: false, y: bob(t, 1, 6, 4) });
  popE(rN1, t, B.two, B.p1); popE(rN2, t, B.two, B.p1); popE(rVs, t, B.two, B.p1, { s: 1 + .05 * Math.sin(t * 8) });
  popE(rW1, t, B.w1, B.p2 - .1, { c: false });
  // P2 comes back alone at the centre
  const p2b = t >= B.p2 ? popE(rP2, t, B.p2, 1e9, { c: false, x: -300 * m2, y: bob(t, 1, 6, 4), s: 1 + .25 * m2 }) : 0;
  popE(rW2, t, B.w2, 1e9, { c: false });
  const f = eio(prog(t, B.fly, 1.4));
  place(rPlane, lerp(-260, 1100, f), lerp(420, 220, f));
  rPlane.style.opacity = +(f > 0 && f < 1);
  rPlane.style.transform = "rotate(-10deg)";
  return p2b;
}

/* ---------- gap: the store says $0, but the money is still in Taiwan ---------- */
const g = [LS("gap"), LS("gap", 1)];
const gShopWrap = Layer(S.gap); gShopWrap.style.transformOrigin = "540px 200px";
const gShop = Box(gShopWrap, 190, 220, 700, 460, CYAN); T(gShop, "美國券商", 72, 344, 36, { color: CYAN }); T(gShop, "交易手續費", 56, 344, 150);
const gZero = T(gShop, "$0", 150, 344, 240, { color: CYAN });
const gPad = Box(S.gap, 110, 1080, 420, 70, CYAN); gPad.style.borderRadius = "50%";
const gTw = T(S.gap, "台灣", 64, 320, 1090, { color: CYAN });
const gP2 = P2(S.gap, 200, 840, 240);
const gPath = put(S.gap, 1080, 1200, `<path d="M330 820 Q700 700 780 420" stroke="#fff" stroke-width="10" fill="none" stroke-dasharray="26 18"/>`, 0, 0);
Object.assign(B, { shop: cue(L(g[0]) + .1, "pop"), z5: cue(W(g[0], "零手續費", 0), "cash"), tw: cue(W(g[1], "先等等", 0), "wrong") });
function rGap(t) {
  const sh = eio(prog(t, B.tw - .1, .6));
  popE(gShop, t, B.shop, 1e9, { c: false });
  gShopWrap.style.transform = `translate(${sh * 200}px, ${sh * 40}px) scale(${1 - .45 * sh})`;
  popE(gZero, t, B.z5, 1e9);
  popE(gPad, t, B.tw, 1e9, { c: false }); popE(gTw, t, B.tw + .1); popE(gP2, t, B.tw, 1e9, { c: false, y: bob(t, 2, 6, 4) });
  gPath.style.opacity = popA(t, B.tw + .5, 1e9, .3);
}

/* ---------- wire: through the bank's gate, out comes a ticket ---------- */
const w = [LS("wire"), LS("wire", 1), LS("wire", 2)];
const wStage = T(S.wire, "STAGE　機票錢", 72, 540, 200, { color: GOLD });
const wP2 = P2(S.wire, 70, 640, 240);
const wGate = Box(S.wire, 440, 500, 200, 420, RED); wGate.style.background = "rgba(255,77,109,.18)";
const wBank = T(S.wire, "銀行", 64, 540, 400, { color: RED });
const wUs = Box(S.wire, 760, 640, 260, 200, CYAN); T(wUs, "美國", 52, 124, 30, { color: CYAN }); T(wUs, "券商", 52, 124, 100, { color: CYAN });
const wWord = word(S.wire, "電匯", "銀行的國際匯款");
const wCoin = put(S.wire, 70, 70, coinIco(70), 505, 640);
const wTicket = put(S.wire, 300, 130, ticketArt(), 360, 240, { size: [360, 156] });
const wFee = T(S.wire, "匯款費用", 64, 540, 960, { color: GOLD });
Object.assign(B, { stage: L(w[0]) - .5, ew: cue(W(w[0], "電匯", 0), "magic", .6), walk: cue(W(w[1], "銀行", 0), "whoosh"), toll: cue(W(w[1], "收", 0), "wrong"), tkt: cue(L(w[2]) + .05, "ding") });
function rWire(t) {
  popE(wStage, t, B.stage + .1, B.stage + 1.9);
  popE(wWord, t, B.ew, Math.max(E(w[0]) + .3, B.ew + 2), { c: false });
  const walk = eio(prog(t, B.walk, .8));
  popE(wP2, t, L(w[0]) - .3, 1e9, { c: false, x: walk * 270, y: -Math.abs(Math.sin(t * 9)) * 16 * (walk > 0 && walk < 1) });
  popE(wGate, t, L(w[0]) - .2, 1e9, { c: false, x: settle(t - B.toll, 12, 5, 4) }); popE(wBank, t, L(w[0]) - .1);
  popE(wUs, t, L(w[0]), 1e9, { c: false });
  const f = prog(t, B.toll, .8);
  wCoin.style.opacity = t < B.toll ? 0 : 1 - prog(t, B.toll + .6, .3);
  wCoin.style.transform = `translate(${-f * 60}px, ${-200 * f + 260 * f * f}px)`;
  popE(wTicket, t, B.tkt, 1e9, { c: false, y: bob(t, 3, 5, 3) }); popE(wFee, t, B.tkt + .2);
}

/* ---------- hp: one ticket on one HP bar, 1萬 then 10萬 ---------- */
const p = [0, 1, 2, 3, 4].map((n) => LS("hp", n));
const hpMain = Layer(S.hp), hpCmp = Layer(S.hp);
const pTicket = put(hpMain, 300, 130, ticketArt(), 360, 220, { size: [360, 156] });
const pCost = T(hpMain, "≈ NT$1,000", 72, 540, 400, { color: GOLD });
const pLab1 = T(hpMain, "匯 1 萬", 80, 540, 520), pLab2 = T(hpMain, "匯 10 萬", 80, 540, 520, { color: GOLD });
const pBar = Box(hpMain, 90, 660, 900, 100, GREEN);
const pFill = el("div", "abs", pBar), pCut = el("div", "abs", pBar);
Object.assign(pFill.style, { left: "8px", top: "8px", height: "72px", background: GREEN, borderRadius: "10px" });
Object.assign(pCut.style, { top: "8px", height: "72px", background: RED, borderRadius: "10px" });
const pDmg1 = T(hpMain, "−1,000　−10%", 80, 540, 820, { cls: "dmg c" }), pDmg2 = T(hpMain, "−1,000　−1%", 80, 540, 820, { cls: "dmg c" });
const pLeft = T(hpMain, "剩 9,000", 72, 540, 960, { color: GREEN });
const cmpRow = (y, lab, cut, pct) => {
  const b = Box(hpCmp, 260, y, 730, 90, GREEN); const fl = el("div", "abs", b);
  Object.assign(fl.style, { left: "8px", top: "8px", height: "62px", width: 702 * (1 - cut) + "px", background: GREEN, borderRadius: "10px" });
  const ct = el("div", "abs", b); Object.assign(ct.style, { left: 8 + 702 * (1 - cut) + "px", top: "8px", height: "62px", width: Math.max(8, 702 * cut) + "px", background: RED, borderRadius: "10px" });
  return [T(hpCmp, lab, 64, 160, y + 4), b, T(hpCmp, pct, 64, 860, y + 110, { cls: "dmg c" })];
};
const cmp1 = cmpRow(380, "1萬", .1, "−10%"), cmp2 = cmpRow(700, "10萬", .01, "−1%");
Object.assign(B, { pt: L(p[0]) - .3, cost: cue(W(p[0], "一千", 0), "cash"), bar: cue(L(p[1]) + .05, "pop"), eat: W(p[1], "吃掉", -.4),
  left: cue(W(p[2], "少了", 0), "thud"), big: cue(W(p[3], "十萬", 0), "boing"), eat2: W(p[3], "還是一千", -.2), cmp: cue(L(p[4]) + .05, "pop") });
B.hit1 = cue(B.eat + .45, "wrong"); B.hit2 = cue(B.eat2 + .45, "wrong", .7);
function rHp(t) {
  shots(t, [[hpMain, 0], [hpCmp, B.cmp]], .3);
  // the ticket drops onto the bar, then comes back for the 10萬 round
  const d1 = eio(prog(t, B.eat, .45)), d2 = eio(prog(t, B.eat2, .45));
  const back = eio(prog(t, B.big, .4));
  const drop = t < B.big ? d1 : 1 - back + d2;
  popE(pTicket, t, B.pt, 1e9, { c: false, y: drop * 420 });
  pTicket.style.opacity = t >= B.pt ? (drop > .95 ? 0 : 1) : 0;
  popE(pCost, t, B.cost, B.eat);
  popE(pLab1, t, B.bar, B.big - .1); popE(pLab2, t, B.big, 1e9);
  popE(pBar, t, B.bar, 1e9, { c: false, x: settle(t - B.hit1, 12, 5, 4) + settle(t - B.hit2, 8, 5, 4) });
  const cut = t < B.big ? .1 * (t > B.hit1) : .01 * (t > B.hit2);
  pFill.style.width = 870 * (1 - cut) + "px";
  pCut.style.left = 8 + 870 * (1 - cut) + "px"; pCut.style.width = (cut ? Math.max(9, 870 * cut) : 0) + "px";
  popE(pDmg1, t, B.hit1, B.big - .1); popE(pDmg2, t, B.hit2, 1e9);
  popE(pLeft, t, B.left, B.big - .1);
  cmp1.forEach((e, k) => popE(e, t, B.cmp + .1, 1e9, { c: k !== 1 }));
  cmp2.forEach((e, k) => popE(e, t, B.cmp + .5, 1e9, { c: k !== 1 }));
}

/* ---------- months: buy every month, wire only twice ---------- */
const mo = [LS("months"), LS("months", 1)];
const mBuy = T(S.months, "買 12 次", 72, 540, 200, { color: GREEN });
const BUY = `<rect x="0" y="0" width="210" height="170" rx="22" fill="#170e3c" stroke="${GREEN}" stroke-width="6"/><rect x="55" y="95" width="26" height="40" rx="4" fill="${GREEN}"/><rect x="92" y="75" width="26" height="60" rx="4" fill="${GREEN}"/><rect x="129" y="50" width="26" height="85" rx="4" fill="${GREEN}"/>`;
const cells = [...Array(12)].map((_, k) => {
  const x = 85 + (k % 4) * 230, y = 340 + Math.floor(k / 4) * 200;
  return { c: put(S.months, 210, 170, BUY, x, y), pl: put(S.months, 200, 120, planeArt(GOLD), x + 45, y - 20, { size: [120, 72] }), x, y };
});
const mWire = T(S.months, "匯款 2 次", 72, 540, 960, { color: GOLD });
Object.assign(B, { cells: F(mo[0], .15), planes: cue(W(mo[1], "不代表", 0), "whoosh") });
cells.forEach((_, k) => k % 3 === 0 && cue(B.cells + k * .12, "tick", .4));
function rMonths(t) {
  popE(mBuy, t, B.cells - .2);
  cells.forEach((m, k) => {
    popE(m.c, t, B.cells + k * .12, 1e9, { c: false });
    const wired = k === 0 || k === 6;
    m.pl.style.opacity = wired ? +(t >= B.planes + (k ? .35 : 0)) : 0;
    m.pl.style.transform = `translateY(${wired ? -40 * (1 - eo(prog(t, B.planes + (k ? .35 : 0), .5))) : 0}px)`;
  });
  popE(mWire, t, B.planes + .6);
}

/* ---------- duel: per-trade fee vs per-wire ticket ---------- */
const du = [LS("duel"), LS("duel", 1)];
const dP1 = P1(S.duel, 20, 260, 200), dP2 = P2(S.duel, 20, 620, 200);
const strip = (y, color) => [...Array(12)].map((_, k) => { const e = el("div", "abs", S.duel); Object.assign(e.style, { left: 250 + k * 60 + "px", top: y + "px", width: "50px", height: "80px", borderRadius: "10px", border: `5px solid ${color}`, boxSizing: "border-box" }); return e; });
const s1 = strip(330, P1C), s2 = strip(690, P2C);
const dTk = [0, 6].map((k) => put(S.duel, 300, 130, ticketArt(""), 250 + k * 60 + 25 - 75, 590, { size: [150, 65] }));
const dPills = [["投多少", 220], ["匯幾次", 540], ["匯款方案", 860]].map(([s, x]) => Pill(S.duel, s, x, 1000, GOLD));
Object.assign(B, { fee: cue(W(du[0], "每次買", 0), "tick", .6), tk2: cue(W(du[0], "機票錢", 0), "wrong", .8),
  q1: cue(W(du[1], "投多少", 0), "pop"), q2: cue(W(du[1], "多久", 0), "pop"), q3: cue(W(du[1], "匯款方案", 0), "pop") });
function rDuel(t) {
  popE(dP1, t, L(du[0]) - .3, 1e9, { c: false, y: bob(t, 0, 5, 4) }); popE(dP2, t, L(du[0]) - .2, 1e9, { c: false, y: bob(t, 1, 5, 4) });
  s1.forEach((e, k) => { e.style.opacity = popA(t, L(du[0]) - .2); e.style.background = t > B.fee + k * .08 ? P1C : "transparent"; e.style.transform = `scaleY(${t > B.fee + k * .08 ? .75 : 1})`; });
  s2.forEach((e, k) => { e.style.opacity = popA(t, L(du[0]) - .1); e.style.background = (k === 0 || k === 6) && t > B.tk2 ? GOLD : "transparent"; });
  dTk.forEach((e, k) => popE(e, t, B.tk2 + k * .25, 1e9, { c: false }));
  [B.q1, B.q2, B.q3].forEach((a, k) => popE(dPills[k], t, a, 1e9));
}
